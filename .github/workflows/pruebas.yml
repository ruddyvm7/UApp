# Pruebas automáticas de UApp en cada cambio (v2.8.1).
# Revisa que los mazos y las versiones estén al día y corre todas las pruebas de _desarrollo/pruebas.
# No usa claves ni datos de Supabase: las pruebas simulan la red.
name: Pruebas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Mazos y versiones al día
        run: python3 _desarrollo/versionar.py --revisar
      - name: Instalar jsdom
        working-directory: _desarrollo/pruebas
        run: npm install --no-audit --no-fund
      - name: Correr todas las pruebas
        working-directory: _desarrollo/pruebas
        env:
          TZ: America/Santiago
        run: node correr-todas.js
