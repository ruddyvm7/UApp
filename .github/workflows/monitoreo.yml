# Monitoreo de miuapp.cl cada hora (v2.8.2), gratis con GitHub Actions (el repositorio es público).
# Corre _desarrollo/monitoreo.sh: la app, el service worker, el panel, la coordinación, los archivos con versión,
# los avisos de Supabase, el certificado y HSTS. Si algo falla dos veces seguidas, abre un aviso («issue») en este
# repositorio —GitHub lo avisa por correo a quien administra el repositorio— y lo cierra solo cuando todo vuelve.
# Ojo: GitHub pausa las tareas programadas de un repositorio público que pasa 60 días sin cambios; basta cualquier
# commit (o «Enable workflow» en la pestaña Actions) para reactivarlas.
name: Monitoreo
on:
  schedule:
    - cron: "23 * * * *"   # cada hora, al minuto 23 (a la hora en punto GitHub suele atrasarse)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: monitoreo
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Revisar miuapp.cl
        id: revisar
        env:
          RESUMEN: ${{ runner.temp }}/resumen.md
        run: bash _desarrollo/monitoreo.sh
      - name: Abrir o cerrar el aviso del monitoreo
        if: always()
        uses: actions/github-script@v7
        env:
          RESUMEN: ${{ runner.temp }}/resumen.md
          RESULTADO: ${{ steps.revisar.outcome }}
        with:
          script: |
            const fs = require('fs');
            const titulo = 'miuapp.cl con problemas (monitoreo automático)';
            const detalle = fs.existsSync(process.env.RESUMEN) ? fs.readFileSync(process.env.RESUMEN, 'utf8') : '(sin detalle)';
            const revision = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const abiertos = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            const aviso = abiertos.find(i => i.title === titulo && !i.pull_request);
            if (process.env.RESULTADO === 'failure' && !aviso) {
              await github.rest.issues.create({ ...context.repo, title: titulo,
                body: `El monitoreo encontró problemas en miuapp.cl (se revisó dos veces, con 90 segundos entre una y otra).\n\n${detalle}\n\n[Ver la revisión](${revision}). Este aviso se cierra solo cuando todo vuelve a funcionar.` });
            } else if (process.env.RESULTADO === 'success' && aviso) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: aviso.number,
                body: `Todo volvió a funcionar. [Ver la revisión](${revision}).\n\n${detalle}` });
              await github.rest.issues.update({ ...context.repo, issue_number: aviso.number, state: 'closed', state_reason: 'completed' });
            }
