<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>UApp · Centro de Estudiantes Derecho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root{
  --wine:#8b0c0c;--wine2:#6c0909;--gold:#c79a3e;--gold2:#a8821f;--navy:#2c080a;--cream:#f1d9b0;
  --bg:#f6f5f2;--card:#ffffff;--cb:#c7d0de;--cb2:#aeb9cc;
  --lockbg:#eef1f8;--ink:#2a2b2e;--muted:#8b8b88;
  --ok:#2c7a4d;--okbg:#e5f3ea;--okb:#a6d3b8;--no:#bd3a2c;--nobg:#fbe9e6;--nob:#e3b3ab;
  --civil:#2f6fd0;--proc:#7a3fd6;--penal:#d23b3b;
  --fgbg:#e6effb;--fgtx:#2f6fd0;--spbg:#fbeede;--sptx:#b5701f;--hebg:#ecd9a0;--hetx:#7a5e11;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.serif{font-family:"Fraunces",serif}
.tabbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid #e7e4dd;display:flex;gap:4px;padding:0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#c9c2b6 transparent;overscroll-behavior-x:contain}
.tabbar::-webkit-scrollbar{height:4px}
.tabbar::-webkit-scrollbar-thumb{background:#c9c2b6;border-radius:4px}
.tabbar::-webkit-scrollbar-track{background:transparent}
.tab.tab-first{margin-left:auto}
.tab.tab-last{margin-right:auto}
.brandbar{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--wine);color:#fff}
.brandlogo{width:48px;height:48px;flex:0 0 48px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px}
.brandlogo img{width:100%;height:100%;object-fit:contain}
.brandtxt{display:flex;flex-direction:column;line-height:1.25}
.brandtxt b{font-size:15px;font-weight:700}
.brandtxt span{font-size:11px;color:var(--cream);font-weight:600}
.tab{background:none;border:0;padding:13px 12px 11px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.active{color:var(--wine);border-color:var(--gold)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.toprule{height:3px;background:var(--wine);border-radius:2px;max-width:760px;margin:18px auto 0}
.h1{text-align:center;color:var(--wine);font-size:34px;font-weight:800;margin:14px 0 8px;letter-spacing:.3px}
.lead{text-align:center;color:#555;font-size:15px;max-width:600px;margin:0 auto 4px}
.cycle{text-align:center;color:#444;font-size:15px;margin-top:6px}
.cycle b{color:#222}

.pbar{height:46px;background:#e9e7e2;border-radius:99px;margin:20px 0 10px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#7a2333,var(--wine));width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pct{text-align:center;color:var(--wine);font-weight:700;font-size:17px;margin-bottom:18px}
.legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:12px 0;border-top:1px solid #e7e4dd;border-bottom:1px solid #e7e4dd}
.legend span{font-size:12.5px;font-weight:600;color:#666;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
.lg{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--cb2)}
.areas{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;padding:16px 0 4px}
.areas span{font-size:13px;font-weight:700;color:#333;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.adot{width:14px;height:14px;border-radius:50%}

.yearcard{background:#fff;border:1px solid #ece9e2;border-radius:18px;padding:20px 18px;margin:22px 0;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.yhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.yhead .yn{color:var(--wine);font-size:30px;font-weight:800}
.yapr{background:#e7f4ea;color:#2c7a4d;border:1px solid #b6dcc3;border-radius:9px;padding:8px 13px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.yapr.on{background:#2c7a4d;color:#fff;border-color:#2c7a4d}
.yrule{height:2px;background:var(--gold);margin:12px 0 0;border-radius:2px}
.tcont{background:#f3f2ef;border-radius:14px;padding:14px 12px;margin-top:14px}
.th{text-align:center;color:#3a2530;font-size:15px;font-weight:700;letter-spacing:1px;margin:14px 0 11px}
.th:first-child{margin-top:4px}

.course{background:#fff;border:1.5px solid var(--cb);border-radius:13px;padding:13px 14px;margin-bottom:11px;cursor:pointer;position:relative;transition:transform .08s,box-shadow .15s}
.course:active{transform:scale(.994)}
.course.tagged{margin-top:20px}
.cname{font-size:16px;font-weight:700;color:#222;line-height:1.3;display:flex;align-items:center;gap:8px}
.dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto}
.pre{margin-top:7px;font-size:13px}
.pre.none{color:var(--muted)}
.pre b{display:block;color:#3a3a3a;font-size:12.5px;margin-bottom:3px}
.pitem{color:#555;margin-left:2px;line-height:1.5}
.yes{color:var(--ok);font-weight:700}.nok{color:var(--no);font-weight:700}
.optlabel{color:var(--gold2);font-weight:700;font-size:12px;letter-spacing:.6px;margin-top:3px}
.course.lock{background:var(--lockbg);border-color:#c4cfe6;cursor:not-allowed}
.course.open{background:#fff;border-color:var(--cb2)}
.course.ok{background:var(--okbg);border-color:var(--okb)}.course.ok .cname{color:#1f6440}
.course.no{background:var(--nobg);border-color:var(--nob)}.course.no .cname{color:#8f2b20}
.ctag{position:absolute;top:-12px;left:14px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.3px;display:flex;align-items:center;gap:5px}
.ctag.fg{background:var(--fgbg);color:var(--fgtx);border:1px solid #c5dcf6}
.ctag.sp{background:var(--spbg);color:var(--sptx);border:1px solid #ecd2a8}
.ctag.he{background:var(--hebg);color:var(--hetx);border:1px solid #d9c277}

.resetbtn{display:block;width:100%;max-width:420px;margin:8px auto 30px;background:#fbe9e6;color:var(--no);border:1px solid #e3b3ab;border-radius:11px;padding:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.cta{display:block;width:100%;background:var(--gold);color:#3a2e08;border:0;border-radius:12px;padding:15px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin:18px 0;letter-spacing:.3px;text-align:center}

/* Simulador */
.seg{display:flex;border:1.5px solid var(--cb);border-radius:11px;overflow:hidden;max-width:560px;margin:16px auto 18px}
.seg button{flex:1;background:#fff;border:0;padding:11px 8px;font-family:inherit;font-size:12.5px;font-weight:700;color:#777;cursor:pointer;border-right:1.5px solid var(--cb)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--wine);color:#fff}
.tablehead{display:grid;grid-template-columns:1fr 96px 108px;gap:10px;padding:0 4px 10px;max-width:760px;margin:6px auto 0}
.tablehead span{color:var(--wine);font-weight:700;font-size:13px;letter-spacing:.6px}
.tablehead .c{text-align:center}
.erow{display:grid;grid-template-columns:1fr 96px 108px;gap:10px;margin-bottom:11px;align-items:center}
.erow input{font-family:inherit;font-size:15px;padding:13px 12px;border:1px solid #ddd;border-radius:11px;background:#fff;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.erow input.c{text-align:center}
.del{background:#fbe9e6;border:0;border-radius:10px;height:46px;color:var(--no);font-size:20px;cursor:pointer}
.simbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 0}
.addn{background:#f0eefb;color:var(--wine);border:1.5px dashed #c9c2e6;border-radius:11px;padding:14px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.3px}
.calcn{background:var(--wine);color:#fff;border:0;border-radius:11px;padding:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px}
.result{background:#fdf8e9;border:1px solid #f0e4bf;border-radius:16px;padding:22px;margin:18px 0;text-align:center}
.result .lab{color:#777;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.result .big{color:var(--wine);font-family:"Fraunces",serif;font-size:60px;font-weight:800;line-height:1.05;margin:4px 0}
.result .vt{font-size:18px;font-weight:700;margin:8px 0 6px}
.result .vd{color:#666;font-size:14.5px;line-height:1.55;max-width:520px;margin:0 auto}
.sumw{text-align:center;color:#888;font-size:12.5px;margin:2px 0 0}
.vg{color:var(--ok)}.vy{color:var(--sptx)}.vr{color:var(--no)}
.note{background:#fdf8e9;border:1px solid #ecdcaf;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#7c6213;margin:0 auto 14px;line-height:1.5;max-width:600px}

/* módulos */
.mh{text-align:center;color:var(--wine);font-family:"Fraunces",serif;font-size:28px;font-weight:800;margin:10px 0 4px}
.msub{text-align:center;color:#666;font-size:14px;margin-bottom:16px}
.day{color:var(--gold2);font-weight:700;font-size:14px;letter-spacing:.4px;margin:16px 0 8px}
.slot{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--cb);border-radius:11px;padding:12px 14px;margin-bottom:8px}
.slot .tm{font-size:13px;font-weight:700;color:var(--wine);min-width:104px}
.slot .rm{font-size:15px;font-weight:600;flex:1}.slot .sl{font-size:12px;color:#888}
.test{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--cb);border-radius:11px;padding:12px 14px;margin-bottom:8px}
.test .dt{text-align:center;min-width:50px}.test .dt b{display:block;font-family:"Fraunces",serif;font-size:22px;color:var(--wine);line-height:1}.test .dt span{font-size:10px;text-transform:uppercase;color:#999}
.test .in{flex:1}.test .in b{font-size:15px}.test .in span{display:block;font-size:12px;color:#888}
.test .ty{font-size:11px;font-weight:700;color:var(--gold2);text-transform:uppercase}
.icard{background:#fff;border:1px solid var(--cb);border-radius:12px;padding:15px;margin-bottom:11px}
.icard a{color:var(--wine);font-weight:700;font-size:15px;text-decoration:none}
.icard p{color:#777;font-size:13px;margin-top:3px}
.example{background:#fdf8e9;border:1px solid #ecdcaf;border-radius:9px;padding:8px 12px;font-size:12px;color:#7c6213;margin-bottom:14px;text-align:center}
.sel2{width:100%;font-family:inherit;font-size:14.5px;font-weight:600;padding:12px;border:1px solid var(--cb2);border-radius:11px;background:#fff;color:var(--wine);margin-bottom:16px}
.hwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--cb2)}
.hgrp{font-size:15px;color:var(--wine);font-weight:700;margin:24px 0 9px;padding-bottom:5px;border-bottom:2px solid var(--gold)}
.hgrp:first-child{margin-top:4px}
.pctrls{display:flex;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.pctrls label{flex:1;min-width:150px;font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:5px}
.pctrls select{font-family:inherit;font-size:14px;padding:9px;border:1px solid var(--cb2);border-radius:9px;background:#fff;color:var(--ink)}
.presum{background:#fbf6ea;border:1px solid #ecdcaf;border-radius:10px;padding:10px 13px;font-size:13px;color:#5a4a1a;margin-bottom:4px}
.pcard{background:#fff;border:1px solid var(--cb2);border-left:4px solid var(--gold);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.popt{border:1px solid var(--cb2,#d8cfba);border-radius:8px;padding:6px 9px;margin-top:5px;background:var(--soft,#f7f4ee)}
.popt-on{border-color:#1f6b3a;background:#eaf6ee}
.pcard-sol{border-left:4px solid #1d4ed8}
.pautor{margin-top:6px;background:#eef2fa;border:1px solid #c7d5f5;border-radius:8px;padding:7px 9px;font-size:.76rem;line-height:1.45;color:#1e3a72}
body.dark .pautor{background:#1a2338;border-color:#33507f;color:#cfe0ff}
.solicbox{background:#eef2fa;border:1px solid #c7d5f5;border-radius:12px;padding:12px 14px;margin:10px 0 4px}
.solicbox .sb-t{font-weight:800;color:#1e3a72;font-size:.92rem;margin-bottom:4px}
.solicbox .sb-p{font-size:.8rem;line-height:1.5;color:#2b3d63;margin:0 0 6px}
.solicbox .sb-l{font-size:.8rem;line-height:1.6;color:#2b3d63;margin:0 0 9px;padding-left:18px}
.solicbox .sb-3a{background:#fff;border:1px solid #c7d5f5;border-radius:9px;padding:9px 11px;margin:2px 0 10px;font-size:.78rem;line-height:1.45}
.solicbox .sb-3a b{display:block;color:#1e3a72;font-size:.82rem}
.solicbox .sb-3a span{display:block;color:#4a5a7d;font-size:.72rem;margin:2px 0 6px}
.solicbox .sb-ck{display:flex;gap:7px;align-items:flex-start;padding:3px 0;color:#2b3d63;cursor:pointer}
.solicbox .sb-ck input{margin-top:2px}
body.dark .solicbox .sb-3a{background:#0f1728;border-color:#33507f}
body.dark .solicbox .sb-3a b{color:#cfe0ff}body.dark .solicbox .sb-ck{color:#b8c8e8}
.solicbox .sb-rut{display:block;font-size:.74rem;font-weight:700;color:#1e3a72;margin:2px 0 3px}
.solicbox .sb-rut span{font-weight:400;opacity:.8}
.solicbox .sb-in{width:150px;padding:7px 10px;border:1.5px solid #c7d5f5;border-radius:9px;font:600 .86rem inherit;background:#fff;color:#1e3a72;margin-bottom:8px;display:block}
body.dark .solicbox .sb-in{background:#0f1728;color:#cfe0ff;border-color:#33507f}
.solicbox .sb-btn{background:#1d4ed8;border-color:#1d4ed8;color:#fff;font-weight:700}
.solicbox .sb-n{font-size:.72rem;color:#4a5a7d;margin-top:7px;line-height:1.4}
body.dark .solicbox{background:#16203a;border-color:#2f4676}
body.dark .solicbox .sb-t{color:#cfe0ff}body.dark .solicbox .sb-p,body.dark .solicbox .sb-l{color:#b8c8e8}
.pdesc{font-size:.78rem;color:var(--muted,#6b6660);line-height:1.45;margin:2px 0 6px}
.popt .pm{margin:0}.popt .pt{margin-top:2px}
.pnrc{color:var(--gold,#c79a3e);font-weight:800}
.pflag3{font-size:.66rem;background:#1f6b3a;color:#fff;border-radius:10px;padding:1px 7px;margin-left:4px;font-weight:700}
.pcard.fitnote{font-size:.79rem;line-height:1.45;padding:8px 11px;margin-bottom:7px}
.pcard .pn{font-weight:700;color:var(--wine);font-size:14.5px}
.pcard .pm{font-size:12.5px;color:#666;margin-top:3px}
.pcard .pt{font-size:12px;color:#7a6a3a;margin-top:5px}
/* Semáforo de secciones en el planificador */
.pcard.pc-red{border-left-color:#c0392b}
.pcard.pc-blue{border-left-color:#2c6fbf}
.pcard.pc-green{border-left-color:#3a8a4f}
.pflag3{display:inline-block;background:#e5f3e9;color:#2b6b3f;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:middle}
.pflag4{display:inline-block;background:#e6eef8;color:#26568f;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:middle}
.palt{font-size:11.5px;color:#3a8a4f;margin-top:5px;font-style:italic}
.pleg{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.plg{font-size:11px;font-weight:600;padding:2px 9px;border-radius:9px;border-left:3px solid}
.plg-red{border-left-color:#c0392b;background:#fbeae8;color:#a3352a}
.plg-blue{border-left-color:#2c6fbf;background:#e6eef8;color:#26568f}
.plg-green{border-left-color:#3a8a4f;background:#e5f3e9;color:#2b6b3f}
body.dark .pflag3,body.dark .plg-green{background:#20352a;color:#8fd0a5}
body.dark .pflag4,body.dark .plg-blue{background:#1e2a3a;color:#9fc0e8}
body.dark .plg-red{background:#3a1f1c;color:#e8a89f}
body.dark .palt{color:#8fd0a5}
.pflag{background:#b3445a;color:#fff;font-size:10px;padding:1px 7px;border-radius:8px;vertical-align:middle;font-weight:600}
.pflag2{background:var(--gold);color:#fff;font-size:10px;padding:1px 7px;border-radius:8px;vertical-align:middle;font-weight:600}
.pexc{font-size:12.5px;color:#777;margin:5px 0;padding-left:2px}
.pinfo{background:#eef3fb;border:1px solid #cdd9ee;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#2f3f63;margin:6px 0}
.hortbl{border-collapse:collapse;width:100%;min-width:680px;font-size:11.5px;table-layout:fixed}
.hortbl td.cell .cr,.hortbl td.cell .cs,.hortbl td.cell .cp{overflow-wrap:anywhere;hyphens:auto}
.hortbl th{background:var(--wine);color:#fff;font-weight:700;padding:9px 6px;font-size:11px;letter-spacing:.4px;text-align:center;border:1px solid #7d3340}
.hortbl th.th-h{background:var(--navy);width:58px}
.hortbl td{border:1px solid var(--cb2);padding:5px;vertical-align:middle;text-align:center;height:34px}
.hortbl td.tm2{background:#f4f1ee;color:#777;font-weight:700;font-size:10px;white-space:nowrap;width:58px}
.hortbl td.cell{background:#fbf6ea;border-color:#ecdcaf;position:relative}
.hortbl .cr{display:block;font-weight:700;color:var(--wine);line-height:1.2}
.hortbl .cn{display:block;font-size:9.4px;font-weight:700;color:var(--gold,#c79a3e);letter-spacing:.2px;line-height:1.25;margin-top:1px}
.autobox{background:var(--soft,#f4f1ea);border:1px dashed var(--cb2,#cfc9bd);border-radius:10px;padding:9px 11px;margin:6px 0 12px;font-size:.78rem;line-height:1.45;color:var(--muted,#6b6660)}
.autobox b{color:var(--ink,#2b2724)}
.autochips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.autochip{background:#fff;border:1.5px solid var(--cb2,#cfc9bd);border-radius:9px;padding:6px 10px;font:600 .76rem/1.3 inherit;color:var(--ink,#2b2724);cursor:pointer;text-align:left}
.autochip.on{border-color:#1f6b3a;background:#eaf6ee}
.autochip .ac-nrc{color:var(--gold,#c79a3e);font-weight:800}
.autochip .ac-sct{color:var(--muted,#6b6660);font-weight:600}
body.dark .autochip{background:#221f1c;color:#eee}
body.dark .autochip.on{background:#1e3327}
body.dark .hortbl .cn{color:#d9b871}
